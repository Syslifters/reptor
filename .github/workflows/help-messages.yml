name: generate-docs
run-name: help-messages
on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/help-messages/**'
      - 'README.md'
permissions:
  contents: write
  pull-requests: write
env:
  plugins: 'findingfromtemplate burp openvas qualys nessus nmap zap createproject pushproject unpackarchive packarchive sslyze file note project template translate ghostwriter finding deletefindings deleteprojects exportfindings defectdojo ai mcp'
jobs:
  help-messages:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install .[all]
    - name: Generate help messages
      run: |
        reptor --help > docs/help-messages/reptor
        for p in $plugins; do
          reptor "$p" --help > docs/help-messages/"$p"
        done
    - name: Update README.md
      run: |
        cat docs/getting-started.md | sed "/## Usage/q" > README.md
        printf "\n\`\`\`" >> README.md
        cat docs/help-messages/reptor >> README.md
        printf "\n\`\`\`" >> README.md
    - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.11
      with:
        commit-message: Update help messages
        committer: Help Message Bot <hello@syslifters.com>
        author: Help Message Bot <hello@syslifters.com>
        branch: chore/update-help-messages
        delete-branch: true
        title: Update help messages
        body: |
          Auto-generated update of `docs/help-messages/` and `README.md`.
        add-paths: |
          docs/help-messages/
          README.md
